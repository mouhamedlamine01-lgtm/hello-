<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2E4CC"/>
      <stop offset="0.55" stop-color="#EAD5B3"/>
      <stop offset="1" stop-color="#DCC098"/>
    </linearGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#1E2A38" stop-opacity="0"/>
      <stop offset="1" stop-color="#1E2A38" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1360" cy="180" r="130" fill="#C1622D" opacity="0.16"/>
  <circle cx="120" cy="760" r="180" fill="#1E2A38" opacity="0.05"/>

  <!-- distant hills -->
  <path d="M0,620 Q200,560 400,610 T800,600 T1200,615 T1600,595 L1600,1000 L0,1000 Z" fill="#D9C09B" opacity="0.6"/>

  <!-- ground -->
  <rect x="0" y="760" width="1600" height="240" fill="#C9AB80"/>
  <rect x="0" y="760" width="1600" height="14" fill="#B8996E"/>

  <!-- background unfinished building block (left) -->
  <g opacity="0.55">
    <rect x="60" y="470" width="260" height="290" fill="#EDE1D0" stroke="#1E2A38" stroke-width="3"/>
    <line x1="60" y1="530" x2="320" y2="530" stroke="#1E2A38" stroke-width="2"/>
    <line x1="60" y1="590" x2="320" y2="590" stroke="#1E2A38" stroke-width="2"/>
    <line x1="60" y1="650" x2="320" y2="650" stroke="#1E2A38" stroke-width="2"/>
    <line x1="60" y1="710" x2="320" y2="710" stroke="#1E2A38" stroke-width="2"/>
    <line x1="150" y1="470" x2="150" y2="760" stroke="#1E2A38" stroke-width="2"/>
    <line x1="230" y1="470" x2="230" y2="760" stroke="#1E2A38" stroke-width="2"/>
  </g>

  <!-- main house under construction (center-right) -->
  <g>
    <rect x="640" y="430" width="430" height="330" fill="#F7EFE3" stroke="#1E2A38" stroke-width="5"/>
    <polygon points="610,430 855,290 1100,430" fill="#C1622D"/>
    <rect x="700" y="560" width="110" height="200" fill="#1E2A38" opacity="0.85"/>
    <rect x="860" y="500" width="90" height="90" fill="#EAD5B3" stroke="#1E2A38" stroke-width="4"/>
    <line x1="905" y1="500" x2="905" y2="590" stroke="#1E2A38" stroke-width="4"/>
    <line x1="860" y1="545" x2="950" y2="545" stroke="#1E2A38" stroke-width="4"/>
    <rect x="990" y="500" width="60" height="60" fill="#EAD5B3" stroke="#1E2A38" stroke-width="4"/>

    <!-- scaffolding around main house -->
    <g stroke="#B08D57" stroke-width="6" fill="none">
      <line x1="600" y1="450" x2="600" y2="760"/>
      <line x1="1110" y1="450" x2="1110" y2="760"/>
      <line x1="600" y1="510" x2="1110" y2="510"/>
      <line x1="600" y1="590" x2="1110" y2="590"/>
      <line x1="600" y1="670" x2="1110" y2="670"/>
      <line x1="600" y1="740" x2="1110" y2="740"/>
      <line x1="600" y1="450" x2="660" y2="510"/>
      <line x1="1050" y1="450" x2="1110" y2="510"/>
      <line x1="600" y1="590" x2="660" y2="650"/>
      <line x1="1050" y1="590" x2="1110" y2="650"/>
    </g>
  </g>

  <!-- crane -->
  <g stroke="#1E2A38" stroke-width="7" fill="none" stroke-linecap="round">
    <line x1="1220" y1="760" x2="1220" y2="330"/>
    <line x1="1220" y1="330" x2="1440" y2="360"/>
    <line x1="1220" y1="360" x2="1300" y2="330"/>
    <line x1="1440" y1="360" x2="1440" y2="460"/>
    <line x1="1220" y1="330" x2="1200" y2="300"/>
  </g>
  <circle cx="1440" cy="466" r="8" fill="#C1622D"/>

  <!-- workers (simple flat silhouettes) -->
  <g fill="#1E2A38">
    <circle cx="520" cy="700" r="14"/>
    <rect x="507" y="716" width="26" height="46" rx="8"/>
    <rect x="500" y="762" width="15" height="40" rx="6"/>
    <rect x="525" y="762" width="15" height="40" rx="6"/>
  </g>
  <g fill="#1E2A38">
    <circle cx="1160" cy="690" r="13"/>
    <rect x="1148" y="705" width="24" height="42" rx="7"/>
    <rect x="1142" y="747" width="14" height="38" rx="6"/>
    <rect x="1164" y="747" width="14" height="38" rx="6"/>
  </g>

  <!-- foreground readability gradient (text side) -->
  <rect width="1600" height="1000" fill="url(#dusk)"/>
  <rect width="900" height="1000" fill="#1E2A38" opacity="0.28"/>
</svg>
