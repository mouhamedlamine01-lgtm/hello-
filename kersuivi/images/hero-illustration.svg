<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7EFE3"/>
      <stop offset="1" stop-color="#F0DFC7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="620" fill="url(#sky)"/>
  <circle cx="660" cy="110" r="70" fill="#D97B4F" opacity="0.18"/>
  <circle cx="90" cy="480" r="90" fill="#1E2A38" opacity="0.06"/>

  <!-- ground -->
  <rect x="0" y="520" width="800" height="100" fill="#E7D6BC"/>

  <!-- house body -->
  <rect x="200" y="330" width="280" height="190" fill="#FFFFFF" stroke="#1E2A38" stroke-width="4"/>
  <polygon points="180,330 340,220 500,330" fill="#C1622D"/>
  <rect x="240" y="400" width="70" height="120" fill="#1E2A38" opacity="0.9"/>
  <rect x="360" y="380" width="60" height="60" fill="#F7EFE3" stroke="#1E2A38" stroke-width="3"/>
  <line x1="390" y1="380" x2="390" y2="440" stroke="#1E2A38" stroke-width="3"/>
  <line x1="360" y1="410" x2="420" y2="410" stroke="#1E2A38" stroke-width="3"/>

  <!-- scaffolding -->
  <g stroke="#B08D57" stroke-width="5" fill="none">
    <line x1="150" y1="340" x2="150" y2="520"/>
    <line x1="520" y1="340" x2="520" y2="520"/>
    <line x1="150" y1="380" x2="520" y2="380"/>
    <line x1="150" y1="440" x2="520" y2="440"/>
    <line x1="150" y1="500" x2="520" y2="500"/>
    <line x1="150" y1="340" x2="220" y2="380"/>
    <line x1="450" y1="340" x2="520" y2="380"/>
  </g>

  <!-- crane -->
  <g stroke="#1E2A38" stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="560" y1="520" x2="560" y2="180"/>
    <line x1="560" y1="180" x2="700" y2="200"/>
    <line x1="560" y1="200" x2="620" y2="180"/>
    <line x1="700" y1="200" x2="700" y2="260"/>
  </g>
  <circle cx="700" cy="264" r="6" fill="#C1622D"/>

  <!-- phone with monitoring update -->
  <g transform="translate(560,340)">
    <rect x="0" y="0" width="150" height="230" rx="20" fill="#1E2A38"/>
    <rect x="10" y="14" width="130" height="180" rx="6" fill="#FFFFFF"/>
    <rect x="10" y="14" width="130" height="60" fill="#C1622D"/>
    <circle cx="30" cy="44" r="12" fill="#FFFFFF" opacity="0.9"/>
    <rect x="50" y="34" width="70" height="8" rx="4" fill="#FFFFFF" opacity="0.9"/>
    <rect x="50" y="48" width="50" height="6" rx="3" fill="#FFFFFF" opacity="0.7"/>
    <rect x="20" y="86" width="110" height="50" rx="6" fill="#F7EFE3"/>
    <rect x="20" y="146" width="70" height="8" rx="4" fill="#1E2A38" opacity="0.7"/>
    <rect x="20" y="160" width="110" height="6" rx="3" fill="#1E2A38" opacity="0.35"/>
    <rect x="20" y="172" width="90" height="6" rx="3" fill="#1E2A38" opacity="0.35"/>
    <circle cx="75" cy="211" r="9" fill="none" stroke="#1E2A38" stroke-width="3"/>
  </g>
</svg>
